name: jellyfin-native-security-test
services:
  jellyfin:
    image: ghcr.io/461932-hub/jellyfin-native-security:12.4-preview1
    container_name: jellyfin-native-security-test
    platform: linux/amd64
    user: "1000:1000"
    restart: unless-stopped
    ports:
      - target: 8096
        published: "8099"
        protocol: tcp
    environment:
      TZ: Europe/Berlin
      # Explicit, unencrypted LAN test. Replace with trusted HTTPS URL later.
      JELLYFIN_SecureMedia__PlaybackBaseUrl: http://192.168.0.113:8099
      JELLYFIN_SecureMedia__AllowInsecureHttpPlayback: "true"
      JELLYFIN_SecureMedia__AllowInsecureHttpImages: "true"
    volumes:
      - type: volume
        source: native_config
        target: /config
      - type: volume
        source: native_cache
        target: /cache
      - type: bind
        source: /DATA/Media
        target: /Media
        read_only: true
      - type: bind
        source: /DATA/hdd
        target: /HDD
        read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
volumes:
  native_config:
    name: jellyfin-native-security-test-config
  native_cache:
    name: jellyfin-native-security-test-cache
x-casaos:
  id: de.danie.jellyfin-native-security-test
  architectures:
    - amd64
  main: jellyfin
  author: 461932-hub
  developer: Jellyfin contributors and this test fork
  category: Media
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/icon.svg
  scheme: http
  index: /web/
  port_map: "8099"
  title:
    en_us: Jellyfin Native Security Test
    de_de: Jellyfin Sicherheitstest
    en_US: Jellyfin Native Security Test
    de_DE: Jellyfin Sicherheitstest
  description:
    en_us: Separate Jellyfin 12.4 test server with native media authorization. Explicit HTTP LAN test on port 8099.
    de_de: Getrennter Jellyfin-12.4-Testserver mit nativer Medienabsicherung. Ausdruecklicher HTTP-Test im Heimnetz auf Port 8099.
  version: 12.4-preview1
