# CasaOS assigns a fresh AppID when no fixed project/container name is supplied.
# $AppID binds config/cache to that installation, not to a developer's test data.
services:
  jellyfin:
    image: ghcr.io/461932-hub/jellyfin-native-security:12.4-preview28
    platform: linux/amd64
    user: "0:0"
    restart: unless-stopped
    network_mode: bridge
    ports:
      - target: 8096
        published: "8100"
        protocol: tcp
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      # Set this to YOUR trusted complete URL only if legacy TV compatibility is needed.
      JELLYFIN_SecureMedia__PlaybackBaseUrl: ""
      JELLYFIN_SecureMedia__AllowInsecureHttpPlayback: "false"
      JELLYFIN_SecureMedia__AllowInsecureHttpImages: "false"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /config
      - type: bind
        source: /DATA/AppData/$AppID/cache
        target: /cache
      - type: bind
        source: /DATA/Media
        target: /Media
      - type: bind
        source: /DATA/hdd
        target: /HDD
    devices:
      - /dev/dri:/dev/dri
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    deploy:
      resources:
        reservations:
          memory: 256M
    x-casaos:
      envs:
        - container: PUID
          description:
            en_US: Numeric Jellyfin user ID. Existing config/cache must belong to this ID.
            de_DE: Numerische Benutzer-ID. Bestehende Konfiguration und Cache muessen dieser ID gehoeren.
        - container: PGID
          description:
            en_US: Numeric Jellyfin group ID. Device groups are retained separately.
            de_DE: Numerische Gruppen-ID. Geraetegruppen bleiben zusaetzlich erhalten.
        - container: TZ
          description:
            en_US: Time zone, for example Europe/Berlin.
            de_DE: Zeitzone, zum Beispiel Europe/Berlin.
        - container: JELLYFIN_SecureMedia__PlaybackBaseUrl
          description:
            en_US: Optional trusted full playback URL including any base path; no automatic Host-header inference.
            de_DE: Optionale vertrauenswuerdige Wiedergabeadresse mit Basispfad; keine Ableitung aus Anfrage-Headern.
        - container: JELLYFIN_SecureMedia__AllowInsecureHttpPlayback
          description:
            en_US: Explicit unencrypted legacy TV playback permission. Default false; use HTTPS for public access.
            de_DE: Ausdrueckliche Freigabe fuer unverschluesselte TV-Wiedergabe. Standard false; oeffentlich HTTPS nutzen.
        - container: JELLYFIN_SecureMedia__AllowInsecureHttpImages
          description:
            en_US: Explicit unencrypted legacy TV image permission. Default false.
            de_DE: Ausdrueckliche Freigabe fuer unverschluesselte TV-Bilder. Standard false.
      ports:
        - container: "8096"
          description:
            en_US: Web interface HTTP; choose a free host port.
            de_DE: HTTP-Weboberflaeche; freien Host-Port waehlen.
        - container: "8920"
          description:
            en_US: Native HTTPS; requires certificate configuration inside Jellyfin.
            de_DE: Natives HTTPS; Zertifikat muss in Jellyfin eingerichtet werden.
        - container: "7359"
          description:
            en_US: UDP client discovery; only one instance can use this host port.
            de_DE: UDP-Serversuche; dieser Host-Port kann nur einer Instanz gehoeren.
        - container: "1900"
          description:
            en_US: UDP SSDP for an installed DLNA plugin; multicast may require host networking.
            de_DE: UDP-SSDP fuer ein installiertes DLNA-Plugin; Multicast kann Host-Netzwerk benoetigen.
      volumes:
        - container: /config
          description:
            en_US: This installation's configuration and database. Never share with another running server.
            de_DE: Konfiguration und Datenbank dieser Installation. Nicht mit einem zweiten laufenden Server teilen.
        - container: /cache
          description:
            en_US: This installation's cache and temporary transcoding data.
            de_DE: Cache und temporaere Umwandlungsdaten dieser Installation.
        - container: /Media
          description:
            en_US: Your media folder. Set read-only if server-side changes are not wanted.
            de_DE: Eigener Medienordner. Bei Bedarf schreibgeschuetzt einbinden.
        - container: /HDD
          description:
            en_US: Optional second media folder; change the host path to your storage.
            de_DE: Zweiter Medienordner; Host-Pfad auf den eigenen Speicher anpassen.
x-casaos:
  architectures:
    - amd64
  main: jellyfin
  author: 461932-hub
  developer: Jellyfin contributors and this community fork
  category: Media
  icon: https://cdn.jsdelivr.net/gh/IceWhaleTech/CasaOS-AppStore@main/Apps/Jellyfin/icon.svg
  scheme: http
  index: /web/
  port_map: "8100"
  title:
    en_us: Jellyfin Cinema
    de_de: Jellyfin Cinema
    en_US: Jellyfin Cinema
    de_DE: Jellyfin Cinema
  description:
    en_US: Jellyfin with Cinema presentation and additional media authentication. Original first-run wizard; no preset account or library. Parallel GPU installation with its own HTTP port; additional ports can be added individually.
    de_DE: Jellyfin mit Cinema-Darstellung und zusaetzlicher Medienanmeldung. Originaler Einrichtungsassistent ohne vorgegebenes Konto oder Bibliothek. Parallele GPU-Installation mit eigenem HTTP-Port; weitere Ports einzeln ergaenzen.
  version: 12.4-preview28
